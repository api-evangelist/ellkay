apis:
- name: LKCloud Interop API
  description: >-
    Single-endpoint healthcare interoperability API exposing proprietary LK* operations (appointments,
    patient bridge/search, documents, charges, patient balance, master lists) that bi-directionally connect
    applications to hundreds of EHR/PM data sources. JSON over HTTPS, invoked as POST operations; OAuth
    2.0 Bearer + SiteServiceKey.
  humanURL: https://lkcloud-api.readme.io/docs/lk-cloud-overview
  baseURL: https://services.lkcloud.com
  tags:
  - Interoperability
  - EHR Integration
  - Healthcare
  properties:
  - type: Documentation
    url: https://lkcloud-api.readme.io/docs/lk-cloud-overview
  - type: APIReference
    url: https://lkcloud-api.readme.io/reference
  aid: ellkay:lkcloud-interop-api
- name: LKCloud FHIR R4 API
  description: >-
    HL7 FHIR R4 RESTful API (read/search/create/update/delete across R4 resources) over the ELLKAY interoperability
    platform, with a published CapabilityStatement. OAuth 2.0 Bearer + SiteServiceKey; errors returned
    as FHIR OperationOutcome resources.
  humanURL: https://lkcloud-api.readme.io/docs/lk-cloud-overview
  baseURL: https://fhir.lkcloud.com/R4
