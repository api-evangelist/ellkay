apis:
- name: LKCloud Interop API
  description: Single-endpoint healthcare interoperability API exposing proprietary LK* operations (appointments, patient bridge/search, documents,
    charges, patient balance, master lists) that bi-directionally connect applications to hundreds of EHR/PM data sources. JSON over HTTPS, invoked
    as POST operations; OAuth 2.0 Bearer + SiteServiceKey.
  humanURL: https://lkcloud-api.readme.io/docs/lk-cloud-overview
