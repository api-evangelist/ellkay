        dvaSc:
          type: string
          description: The  refractive error is measured to see how nearsighted (myopic) or farsighted (hyperopic) a person is, without any corrective lenses in place
        dvaScMod:
          type: string
          description: Modifiers in cycloplegic refraction are adjustments made to the basic refractive error based on other factors. These adjustments are calculated during the refraction process but without the application of lenses for correction
        dvaCc:
          type: string
          description: Measurement of refractive error for seeing far objects under cycloplegia (with correction)
        dvaCcMod:
          type: string
          description: Additional corrections like prism, base direction, or vertex distance adjustments
        nvaSc:
          type: string
          description: An assessment of how much refractive power is needed for clear near vision (e.g., reading, close-up work) while the eye is cyclopleged and no glasses or contacts are being used
        nvaScMod:
          type: string
          description: Modifiers are additional elements that influence the final prescription or diagnosis but are measured without applying corrective lenses during the test
        nvaCc:
          type: string
          description: How well the patient sees up close (e.g., reading) while wearing their current correction
        nvaCcMod:
