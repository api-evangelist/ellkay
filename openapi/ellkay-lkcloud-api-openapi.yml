        sphere:
          type: string
          description: Cycloplegic sphere:after the cycloplegic drops take effect, the sphere value will indicate the true refractive error of the eye without the influence of accommodation
        cylinder:
          type: string
          description: Cylinder in cycloplegic refraction  measure astigmatism and is crucial in determining the true refractive error once accommodation is paralyzed
        axis:
          type: string
          description: If a person has astigmatism, the axis value  place the cylindrical power in the correct orientation
        add:
