        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.ScheduleAppointmentsSwaggerRequest'
            example:
              scheduleAppointmentRequest:
                start: '2023-09-01T00:00:00'
                end: '2023-09-01T00:00:00'
                dateRange:
                  start: '2023-09-01T02:30:00+00:00'
