components:
  schemas:
    LKCloudConnect.Contracts.Appointments.Appointment:
      type: object
      properties:
        id:
          type: string
          description: Appointment id
        start:
          type: string
          description: Appointment start date. (DateTimeOffset) e.g. 2019-01-01T00:00:00+00:00
          format: date-time
          example: '2019-01-01T00:00:00+00:00'
        duration:
          type: string
          description: Appointment duration e.g. 00:30:00
          example: 00:30:00
        patientId:
          type: string
          description: Appointment patient id
        patientAlternateId:
          type: string
          description: Appointment patient alternate id
        physicianId:
          type: string
          description: Appointment physician id
        facilityId:
          type: string
          description: Appointment facility id
        facilityName:
          type: string
          description: Appointment facility name
        notes:
          type: string
          description: Appointment notes
        status:
          enum:
          - InvalidStatus
          - Other
          - Pending
          - Waitlist
          - Booked
          - Started
          - Complete
          - Cancelled
          - Discontinued
          - Deleted
          - Blocked
          - Overbook
          - NoShow
          - Rescheduled
          - Confirmed
          type: string
          description: Appointment status
          example: Other
        modified:
          type: string
          description: Appointment last modified date. (DateTimeOffset) e.g. 2019-01-01T00:00:00+00:00
          format: date-time
          example: '2019-01-01T00:00:00+00:00'
        type:
          type: string
          description: Appointment type display
        billable:
          enum:
          - Unspecified
          - 'True'
          - 'False'
          type: string
          description: Appointment billable status
        department:
          allOf:
          - $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.Department'
          description: Appointment department
        resources:
          type: array
          items:
            $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.AppointmentResource'
          description: Appointment resources
        statusCode:
          allOf:
          - $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.MappedCode'
          description: "Appointment status code\r\n'InvalidStatus 'Other' 'Pending' 'Waitlist' 'Booked' 'Started' 'Complete' 'Cancelled' 'Discontinued' 'Deleted' 'Blocked' 'Overbook' 'NoShow' 'Rescheduled' 'Confirmed'"
        appointmentTypeId:
          type: string
          description: Appointment type id
        reason:
          allOf:
          - $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.MappedCode'
          description: "Appointment reason\r\nAppointment reason is not standardized, and only source code is provided."
        created:
          type: string
          description: Appointment created date. (DateTimeOffset) e.g. 2019-01-01T00:00:00+00:00
          format: date-time
          example: '2019-01-01T00:00:00+00:00'
        custom:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: System-specific data for special cases
      additionalProperties: false
      description: Appointment object
    LKCloudConnect.Contracts.Appointments.AppointmentResource:
      type: object
      properties:
        id:
          type: string
          description: The id of the appointment resource
      additionalProperties: false
      description: A resource related to an appointment
    LKCloudConnect.Contracts.Appointments.AppointmentResourceFilter:
      type: object
      properties:
        id:
