  /LKAppointments/NextSearchAppointments:
    post:
      tags:
      - LKAppointments
      summary: NextSearchAppointments
      description: "The NextSearchAppointments endpoint retrieves the next set of appointments using the initial token from BeginGetUpdatedAppointments The returned data includes details such as appointment ID, start time, duration, patient and physician IDs, and status.\r\n            \r\nThe response also includes a token for the next page, which should be passed to the NextGetUpdatedAppointments endpoint.For guidance on handling errors in paginated responses, refer to the error codes guide."
      requestBody:
        description: Request message
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.NextSearchAppointmentsSwaggerRequest'
            example:
              token:
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
