        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.NextSearchAppointmentsResponse'
              example:
                appointments:
                - id: '789265'
                  start: '2025-06-01T09:00:00+00:00'
                  duration: 00:30:00
                  patientId: '780910'
                  patientAlternateId: '465001'
                  physicianId: '456'
