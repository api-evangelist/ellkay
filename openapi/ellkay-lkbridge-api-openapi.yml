paths:
  /LKBridge/GetAdvanceDirectives:
    post:
      tags:
      - LKBridge
      summary: GetAdvanceDirectives
      description: This endpoint provides advance directive information for a given patient request.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKBridge.GetAdvanceDirectivesSwaggerRequest'
            example:
              request:
                patientId: '12396245'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.GetAdvanceDirectivesResponse'
              example:
                patientId: '12396245'
                advanceDirectives:
                - id: AD-001
                  code: HL70062
                  displayName: Living Will
                  effectiveDate: '2020-01-15T00:00:00.112+00:00'
                  expirationDate: '2030-01-15T00:00:00.112+00:00'
                  custom:
                    notes: Patient has expressed specific wishes regarding end-of-life care.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKBridgeGetAdvanceDirectives
      x-operation-id-source: derived
  /LKBridge/GetBridgeInfo:
    post:
      tags:
      - LKBridge
      summary: GetBridgeInfo
      description: The GetBridgeInfo endpoint returns bridge information, including availability status, error code, capabilities, module version, deployment and published dates, alerts, and configuration details.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.BridgeInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
