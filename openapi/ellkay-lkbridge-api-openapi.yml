  /LKBridge/SmartSearch:
    post:
      tags:
      - LKBridge
      summary: SmartSearch
      description: 'Search using a pipe-delimited string. Supported parameters include last name, first name, social security number, chart number, date of birth, phone number, gender, facility ID, home phone, mobile phone, ZIP code, external ID and MRN. All search parameters are combined with an AND logic and use partial matching. For example, a chart number ""ABCD"" might match ""ABC"" and ""ABCD.""


        Each search field is interpreted based on its position in the pipe-delimited string. If you want to search by chart number only, your search string would look like ""|||my-chart-number||"". Omitting trailing pipes, such as ""|||my-chart-number"", is also valid.


        Here are the supported search fields:


        Last name: Free text (e.g., Smith)

        First name: Free text (e.g., Jane)

        Social Security Number: nnn-nn-nnnn (e.g., 123-45-6789)

        Chart Number: Free text(e.g., 00AAB)

        Date of Birth: MM/dd/yyyy(e.g., 08/31/1984)

        Phone Number: +n-nnn-nnn-nnnn(e.g., +1-201-123-4567)

        Gender: Supports “M”, “F”, and “U”

        Facility ID: Free text(e.g., 123)

        Home Phone: +n-nnn-nnn-nnnn(e.g., +1-201-123-4567)

        Mobile Phone: +n-nnn-nnn-nnnn(e.g., +1-201-123-4567)

        ZIP Code: Free text(e.g., 08394)

        External ID: Free text(e.g., 12345)

        MRN: Free text(e.g., 00046057)


        Example query: ""last-name|first-name|social-security-number|chart-number|date-of-birth|phone-number|gender|facility-id|home-phone|mobile-phone|zip|external-id|mrn""'
      requestBody:
        description: request object
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKBridge.SmartSearchSwaggerRequest'
            example:
              query: Anderson|Mia|||04/12/1992|||||||
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.SmartSearchResult'
              example:
                patients:
                - chartNumber: 00046057-008
                  lastName: Anderson
                  middleName: B
                  firstName: Mia
                  socialSecurityNumber: null
                  dateOfBirth:
                    value: /Date(703036800000)/
                    raw: 04/12/1992
                  sex: Female
                  id: '1239620407150620'
                  zipCode: 84403-4303
                  custom:
                    reviewedBy: Dr. Alice Grey
                    technician: John Smith
                  mrn: '00046057'
                text: legacy-text
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKBridgeSmartSearch
      x-operation-id-source: derived
