openapi: 3.2.0
info:
  title: LKCloud LK Patient Data Link API
  description: Ellkay Api documentation 6.6 Ellkay api
  contact:
    name: Ellkay
    url: https://ellkay.com
    email: ''
  version: '6.6'
  x-logo:
    url: ./logo.png
    altText: Ellkay Logo
servers:
- url: https://services.lkcloud.com
  description: prod url
tags:
- name: LKPatientDataLink
  description: PatientDataLink endpoint
paths:
  /LKPatientDataLink/BeginGetUpdatedPatients:
    post:
      tags:
      - LKPatientDataLink
      summary: BeginGetUpdatedPatients
      description: 'The BeginGetUpdatedPatients endpoint initiates the process to get updated patients in a specified date range, providing a next token for pagination purposes.


        See error codes guide for instructions on paged error handling'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKPDL.BeginGetUpdatedPatientsSwaggerRequest'
            example:
              request:
                startDate: '2023-12-31T00:00:00+00:00'
                endDate: '2023-01-01T00:00:00+00:00'
                providerId: '35473'
                facilityId: '253562'
                limit: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PagedResult'
              example:
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientDataLinkBeginGetUpdatedPatients
      x-operation-id-source: derived
  /LKPatientDataLink/CloseEncounter:
    post:
      tags:
      - LKPatientDataLink
      summary: CloseEncounter
      description: Close an encounter. Only supported for specific EHRs and limited encounter types.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKPDL.CloseEncounterSwaggerRequest'
            example:
              request:
                patientId: '1442678381000620'
                encounterId: '1481732394050560'
                custom:
                  reviewedBy: Dr. Alice Grey
                  technician: John Smith
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientDataLink.CloseEncounterResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientDataLinkCloseEncounter
      x-operation-id-source: derived
  /LKPatientDataLink/CreateEncounter:
    post:
      tags:
      - LKPatientDataLink
      summary: CreateEncounter
      description: Creates a new encounter
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKPDL.CreateEncounterSwaggerRequest'
            example:
              request:
                dateTime: '2023-08-01T00:00:00+00:00'
                patient:
                  id: '1442678381000620'
                facility:
                  id: '8'
                provider:
                  id: '442'
                comments: Simple text comment
                reason:
                  id: '1'
                  reasonText: Encounter Reason Text
                resource:
                  id: '519'
                custom:
                  reviewedBy: Dr. Alice Grey
                  technician: John Smith
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientDataLink.CreateEncounterResult'
              example:
                encounterId: '737846'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientDataLinkCreateEncounter
      x-operation-id-source: derived
  /LKPatientDataLink/GetAllergies:
    post:
      tags:
      - LKPatientDataLink
      summary: GetAllergies
      description: The GetAllergies endpoint returns a list of allergies for a patient, including details such as the date, comments, encounter ID, patient ID, allergen, reaction, and severity.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKPDL.GetAllergiesSwaggerRequest'
            example:
              patientId: null
              request:
                patientId: '1225794122051060'
                dateRange:
                  start: '2010-01-01T00:00:00+00:00'
                  end: '2014-01-07T00:00:00+00:00'
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientDataLink.GetAllergiesResult'
              example:
              - date: 02/22/2020 00:00:00
                created: 08/31/1984 14:20:00
                modified: 08/31/1984 14:20:00
                comments: Allergies trigger immune responses.
                encounterId: '14281667'
                patientId: '13267256'
                physicianId: '13268163'
                isAllergic: '1'
                onsetDate: 08/31/1984 14:20:00
                allergen: Lidocaine
                reaction: Anaphylaxis
                type: DA
                severity: Moderate
                codeSystemId: NDC
                allergyCode: '10135057396'
                id: '2946748'
                legacyallergictoid: '455637'
                updatedBy: '73268163'
                updatedDate: 08/31/1984 14:20:00
                reactionCode: '5409'
                reactionCodeSystemID: '56984'
                custom:
                  source: Manual Entry
