  /LKPatientDataLink/GetEncounterNoteBody:
    post:
      tags:
      - LKPatientDataLink
      summary: GetEncounterNoteBody
      description: 'The GetEncounterNoteBody endpoint returns the body of an encounter note, including details such as note ID, name, date, patient ID, provider, and file format.


        If the original content is in HTML format, it will be converted to a PDF unless this option is disabled in the configuration. Structured documents will be returned in HTML format.'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKPDL.GetEncounterNoteBodySwaggerRequest'
            example:
              patientId: '41170010'
              encounterNoteId: '38762828'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientDataLink.GetEncounterNoteBodyResult'
              example:
                id: '38762828'
                name: Office Visit
                date: /Date(-62135448687934)/
                patientId: '41170010'
                fileFormat: txt
                provider:
                  lastName: Shwaiki
                  firstName: Wassim
                  npi: '1013115039'
                  id: '456128'
                body: eyJhbGxlcmdpZXMiOltdLCJeyJ==
                pages: null
                custom:
                  source: Manual Entry
                  note: Initial diagnosis from ER visit
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientDataLinkGetEncounterNoteBody
      x-operation-id-source: derived
