  /LKPatientDataLink/GetLabResults:
    post:
      tags:
      - LKPatientDataLink
      summary: GetLabResults
      description: 'The GetLabResults endpoint provides a list of lab results for a patient, including details such as order number, test name, result value, units, range, and status.


        This API provides a list of items, with each item containing specific lab result data.It''s important to note that a single lab test might generate multiple items in the list. For instance, a blood panel could include several results, such as White Blood Count, Red Blood Count, and others.'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKPDL.GetLabResultsSwaggerRequest'
            example:
              patientId: null
              request:
                patientId: '67267056'
                dateRange:
                  start: '1984-08-01T00:00:00+00:00'
                  end: '1984-10-07T00:00:00+00:00'
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientDataLink.GetLabResultsResult'
              example:
              - orderNumber: '20278619'
                orderDate: 11/23/2023 08:15:00
                orderTestName: Glucose
                resultName: Glucose
                resultDate: '2023-11-23T10:30:00'
                value: '85'
                units: mg/dL
