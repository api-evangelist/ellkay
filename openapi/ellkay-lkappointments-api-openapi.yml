                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsGetAppointments
      x-operation-id-source: derived
  /LKAppointments/GetFacilities:
    post:
      tags:
      - LKAppointments
      summary: GetFacilities
      description: The GetFacilities endpoint provides a list of facilities, each containing details such as facility ID, code, name, address, city, state, zip code, and phone number.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
