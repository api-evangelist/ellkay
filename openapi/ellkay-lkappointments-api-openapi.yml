openapi: 3.2.0
info:
  title: LKCloud LK Appointments API
  description: Ellkay Api documentation 6.6 Ellkay api
  contact:
    name: Ellkay
    url: https://ellkay.com
    email: ''
  version: '6.6'
  x-logo:
    url: ./logo.png
    altText: Ellkay Logo
servers:
- url: https://services.lkcloud.com
  description: prod url
tags:
- name: LKAppointments
  description: Ellkay Appointment endpoints
paths:
  /LKAppointments/BeginSearchAppointments:
    post:
      tags:
      - LKAppointments
      summary: BeginSearchAppointments
      description: The BeginSearchAppointments endpoint initiates the process to search for appointments, providing a next token for pagination purposes.
      requestBody:
        description: Request message
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.BeginSearchAppointmentsSwaggerRequest'
            example:
              request:
                dateRange:
                  start: '2022-01-01T00:00:00+00:00'
                  end: '2022-12-01T00:00:00+00:00'
                patients:
                - id: '1442678381000620'
                resources:
                - id: '7'
                facilities:
                - id: '3'
                statuses:
                - id: '12810'
                lastModified:
                  start: '2022-01-01T00:00:00+00:00'
                  end: '2022-12-01T00:00:00+00:00'
                rawRequest: null
                limit: 500
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PagedResult'
              example:
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsBeginSearchAppointments
      x-operation-id-source: derived
  /LKAppointments/EditAppointment:
    post:
      tags:
      - LKAppointments
      summary: EditAppointment
      description: Edit an existing appointment, including status change for cancelling an appointment
      requestBody:
        description: Request message
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.EditAppointmentSwaggerRequest'
            example:
              request:
                facilityId: '3'
                locationId: '34'
                providerId: '7'
                start: '2023-09-01T00:00:00+00:00'
                end: '2023-09-01T00:00:00+00:00'
                dateRange:
                  start: '2023-09-01T02:30:00+00:00'
                  end: '2023-09-30T03:30:00+00:00'
                id: '282'
                patientId: '1442678380100620'
                notes: Patient follow up
                status: Other
                rawStatus: Other
                appointmentType: Follow Up Patient
                externalId: ''
                resources:
                - id: '460'
                reason: null
                custom:
                  reviewedBy: Dr. Alice Grey
                  technician: John Smith
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.EditAppointmentResponse'
              example: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsEditAppointment
      x-operation-id-source: derived
  /LKAppointments/GetAppointment:
    post:
      tags:
      - LKAppointments
      summary: GetAppointment
      description: The GetAppointment endpoint returns comprehensive information about an appointment, including its ID, start time, duration, and associated patient and physician IDs.
      requestBody:
        description: Request object
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.GetAppointmentSwaggerRequest'
            example:
              request:
                appointmentId: '19'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.Appointment'
              example:
                id: '12'
                start: '2022-01-01T00:00:00+00:00'
                duration: 00:05:00
                patientId: '2456851'
                patientAlternateId: '2456851'
                physicianId: '235'
                facilityId: '148'
                facilityName: Davis Family Physicians
                notes: notes
                status: Other
                modified: '2022-01-01T00:00:00+00:00'
                type: OV
                billable: Unspecified
                department:
                  name: Patient Scheduling
                resources:
                - id: '13013603'
                statusCode:
                  code: Booked
                  source: CHK
                  sourceText: Check Out
                appointmentTypeId: '114'
                reason:
                  code: ''
                  source: spirometry
                  sourceText: spirometry
                created: '2022-01-01T00:00:00+00:00'
                custom:
                  reviewedBy: Dr. Alice Grey
                  technician: John Smith
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsGetAppointment
      x-operation-id-source: derived
  /LKAppointments/GetAppointmentSlot:
    post:
      tags:
      - LKAppointments
      summary: GetAppointmentSlot
      description: The GetAppointmentSlot endpoint returns details of an available appointment slot, including physician and facility IDs, start time, duration, slot ID, type, and status.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.AppointmentSlotSwaggerRequest'
            example:
              request:
                slotId: '3_7_980_30_202208101024'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.AppointmentSlot'
              example:
                physicianId: '7'
                facilityId: '3'
                startTime: '2022-01-01T00:00:00+00:00'
                duration: 00:00:00
                slotId: '980'
                type: '30'
                status: Booked
                custom:
                  producer: Nvestment
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsGetAppointmentSlot
      x-operation-id-source: derived
  /LKAppointments/GetAppointmentStatuses:
    post:
      tags:
      - LKAppointments
      summary: GetAppointmentStatuses
      description: The GetAppointmentStatuses endpoint returns a list of appointment statuses, each containing the code, name, and unique ID of the status.
      requestBody:
        description: Request object
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.GetAppointmentStatusesSwaggerRequest'
            example:
              request: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.AppointmentStatuses.GetAppointmentStatusesResult'
              example:
                appointmentStatuses:
                - code: PEN
                  name: Pending
                  id: '5'
                  custom:
                    reviewedBy: Dr. Alice Grey
                    technician: John Smith
                - code: CHK
                  name: Check Out
                  id: '6'
                  custom:
                    reviewedBy: Dr. James Martin
                    technician: Alen stok
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsGetAppointmentStatuses
      x-operation-id-source: derived
  /LKAppointments/GetAppointmentTypes:
    post:
      tags:
      - LKAppointments
      summary: GetAppointmentTypes
      description: The GetAppointmentTypes endpoint returns a list of appointment types, each containing the name, code, and unique ID of the appointment type.
      requestBody:
        description: Request filter
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.GetAppointmentTypesSwaggerRequest'
            example:
              request:
                includeInactive: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.AppointmentTypesResult'
              example:
                appointmentTypes:
                - name: Office Visit
                  code: OV
                  id: '114'
                  custom:
                    reviewedBy: Dr. Alice Grey
                    technician: John Smith
                - name: Consultation
                  code: CONSULT
                  id: '66'
                  custom:
                    reviewedBy: Dr. Leil Mark
                    technician: Koll Alen
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsGetAppointmentTypes
      x-operation-id-source: derived
  /LKAppointments/GetAppointments:
    post:
      tags:
      - LKAppointments
      summary: GetAppointments
      description: 'The GetAppointments endpoint returns a list of appointments, each containing details such as ID, start time, duration, and associated patient and physician IDs.


        Does not include deleted or cancelled appointments'
      requestBody:
        description: Request object
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.GetAppointmentsSwaggerRequest'
            example:
              request:
                dateRange:
                  start: '2022-01-01T00:00:00+00:00'
                  end: '2022-12-01T00:00:00+00:00'
                patientId: '1442678380100620'
                physicianId: ''
                facilityId: '3'
                statusCodes:
                - code: Booked
                resources:
                - id: '13013603'
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.Appointment'
              example:
              - id: '12'
                start: '2022-01-01T00:00:00+00:00'
                duration: 00:05:00
                patientId: '2456851'
                patientAlternateId: '2456851'
                physicianId: '235'
                facilityId: '148'
                facilityName: Davis Family Physicians
                notes: notes
                status: Other
                modified: '2022-01-01T00:00:00+00:00'
                type: OV
                billable: Unspecified
                department:
                  name: Patient Scheduling
                resources:
                - id: '13013603'
                statusCode:
                  code: Booked
                  source: CHK
                  sourceText: Check Out
                appointmentTypeId: '114'
                reason:
                  code: ''
                  source: spirometry
                  sourceText: spirometry
                created: '2022-01-01T00:00:00+00:00'
                custom:
                  reviewedBy: Dr. Alice Grey
                  technician: John Smith
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
