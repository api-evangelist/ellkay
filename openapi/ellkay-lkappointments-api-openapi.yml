  /LKAppointments/NextSearchAppointments:
    post:
      tags:
      - LKAppointments
      summary: NextSearchAppointments
      description: 'The NextSearchAppointments endpoint retrieves the next set of appointments using the initial token from BeginGetUpdatedAppointments The returned data includes details such as appointment ID, start time, duration, patient and physician IDs, and status.


        The response also includes a token for the next page, which should be passed to the NextGetUpdatedAppointments endpoint.For guidance on handling errors in paginated responses, refer to the error codes guide.'
      requestBody:
        description: Request message
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.NextSearchAppointmentsSwaggerRequest'
            example:
              token:
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.Appointments.NextSearchAppointmentsResponse'
              example:
                appointments:
                - id: '789265'
                  start: '2025-06-01T09:00:00+00:00'
                  duration: 00:30:00
                  patientId: '780910'
                  patientAlternateId: '465001'
                  physicianId: '456'
                  facilityId: '101'
                  facilityName: Downtown Medical Center
                  notes: Patient requested early morning slot.
                  status: Booked
                  modified: '2025-05-10T15:30:00+00:00'
                  type: Follow-up Visit
                  billable: Unspecified
                  department:
                    name: Internal Medicine
                  resources:
                  - id: '101'
                  statusCode:
                    code: Open
                    source: null
                    sourceText: null
                  appointmentTypeId: '05'
                  reason:
                    code: R10
                    source: ehr-specific-code
                    sourceText: Routine Checkup
                  created: '2025-05-01T08:00:00+00:00'
                  custom:
                    referralSource: Dr. Smith
                    priority: High
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKAppointmentsNextSearchAppointments
      x-operation-id-source: derived
  /LKAppointments/ScheduleAppointment:
    post:
      tags:
      - LKAppointments
      summary: ScheduleAppointment
      description: Schedule an appointment in an available appointment slot
      requestBody:
        description: Schedule appointment request
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.Appointments.ScheduleAppointmentsSwaggerRequest'
            example:
              scheduleAppointmentRequest:
                start: '2023-09-01T00:00:00'
