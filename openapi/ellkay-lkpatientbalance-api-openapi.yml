        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.PatientBalance.GetBalanceSwaggerRequest'
            example:
              request:
                patientId: '1442678'
                dateRange:
                  start: '2019-01-01T00:00:00+00:00'
                  end: '2020-01-07T00:00:00+00:00'
                lastUpdated: '2023-01-01T00:00:00+00:00'
                includeInsuranceDetail: false
