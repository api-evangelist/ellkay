                    reviewedBy: Dr. Alice Grey
                    technician: John Smith
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientBalanceGetAccount
      x-operation-id-source: derived
  /LKPatientBalance/GetBalance:
    post:
      tags:
      - LKPatientBalance
      summary: GetBalance
      description: 'The GetBalance endpoint provides detailed balance information for patients, including their personal details, guarantor details, account ID, and a list of encounters with their respective balances and services.


        This is a resource-intensive operation and should be used judiciously.Whenever feasible, opt for using GetBalanceSummary instead.'
