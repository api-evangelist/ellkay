  /LKPatientBalance/NextSearchClaims:
    post:
      tags:
      - LKPatientBalance
      summary: NextSearchClaims
      description: 'The NextSearchClaims endpoint allows to retrieve the next set of claims in a paginated sequence. It is typically used after the initial request to BeginSearchClaims, which provides the first batch of claims along with a pagination token.


        By passing this token to NextSearchClaims, user can continue fetching subsequent pages of claims until all records are retrieved.'
      requestBody:
        description: Request message
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.PatientBalance.NextSearchClaimsSwaggerRequest'
            example:
              token:
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
