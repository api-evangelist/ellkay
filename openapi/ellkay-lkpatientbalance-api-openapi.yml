                claims:
                - claimId: '202512345'
                  patient:
                    id: '104201'
                  encounterId: '20251201'
                  ticketNumber: '202512'
                  claimReferenceNumber: '202512345'
                  guarantor:
                    id: '221001'
                  billType: '131'
                  totalAmount: 500
                  claimBilledDate: '2025-11-15T00:00:00.112+00:00'
                  claimTransmittedDate: '2025-11-20T00:00:00.112+00:00'
                  claimDenialDate: '2025-10-15T00:00:00.112+00:00'
                  claimDenialLevel: Level2
