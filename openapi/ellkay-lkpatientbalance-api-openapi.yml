                        revenueCode: '0510'
                    guarantor:
                      id: '202'
                      firstName: John
                      lastName: Doe
                    printStatement: true
                    isVoided: false
                    facilityId: '001'
                    physicianId: '450'
                    custom:
                      financialClass: Commercial
                  patientAccountBalance: 95
                  custom:
                    sourceSystem: EHR-X
                    notes: Balance from Q4 2024
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
