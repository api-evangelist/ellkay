          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientBalance.GetAccountResponse'
              example:
                account:
                  guarantorId: '439726'
                  accountId: '838620'
                  balance: 10
                  totalBalance: 150
                  patients:
                  - id: '144267'
                    balance: 10
