        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientBalance.GetBalanceResult'
              example:
                patients:
                - patient:
                    firstName: Jane
                    lastName: Smith
                    id: '1442678'
                    guarantor:
                      id: '202'
                      firstName: John
                      lastName: Doe
                    accountId: '98765'
                  totalPatientBalance: 75
                  unposted: 20
                  encounters:
                  - id: '107481'
                    appointmentBalance: 250
                    patientBalance: 75
                    copay: 25
                    adjustment: 15
                    insuranceStatus: FollowUp
                    patientBillingStatus: FollowUp
                    date: '2019-11-01T10:30:00+00:00'
                    firstBilledDate: '2019-11-05T08:00:00+00:00'
                    patientResponsibleDate: '2019-11-15T00:00:00+00:00'
                    diagnoses:
                    - text: Acute sinusitis
                      coding:
                      - system: ICD-10
                        code: J01.90
                        display: Acute sinusitis, unspecified
                    services:
                    - claimId: '12345'
                      id: '001'
                      name: Office Visit - Established Patient
                      code: '99213'
                      description: Office or other outpatient visit for the evaluation and management of an established patient, typically 15 minutes.
                      units: 1
                      adjustment: 15
                      refund: 0
                      billedAmount: 120
                      patientBalance: 20
                      patientPaid: 40
                      insuranceBalance: 55
                      insurancePaid: 65
                      modifiers:
                      - '25'
                      diagnoses:
                      - text: Acute sinusitis
                        coding:
                        - system: icd-10
                          code: J01.90
                          display: Acute sinusitis, unspecified
                      - text: Cough
                        coding:
                        - system: icd-10
                          code: R05
                          display: Cough
                      billedInsurances:
                      - payerId: '564153'
                        insuranceName: Health Insurance Co.
                        insuranceCode: INS001
                        priority: Primary
                        insuranceBalance: 35
                        insurancePaid: 45
                      - payerId: '789654'
                        insuranceName: Secondary Health Insurance Co.
                        insuranceCode: INS002
                        priority: Secondary
                        insuranceBalance: 20
                        insurancePaid: 20
