      operationId: postLKPatientBalanceVoidPayment
      x-operation-id-source: derived
components:
  schemas:
    LKCloudConnect.Contracts.PatientBalance.ClaimProcedures:
      type: object
      properties:
        code:
          type: string
          description: Human-readable description of the procedures.
        units:
          type: number
          description: Quantity of services performed for the procedure.
          format: double
        modifiers:
          type: array
          items:
            type: string
          description: Procedure modifiers that provide additional context.
        icD10:
          type: array
          items:
            type: string
          description: Linked diagnosis codes (ICD‑10) that establish medical necessity for the procedure.
        typeOfService:
          type: string
          description: Service category for the procedure.
      additionalProperties: false
    LKCloudConnect.Contracts.PatientBalance.UpdateBillingAlertResponse:
      type: object
      additionalProperties: false
      description: result data for UpdateBillingAlert
