openapi: 3.2.0
info:
  title: LKCloud LK Patient Balance API
  description: Ellkay Api documentation 6.6 Ellkay api
  contact:
    name: Ellkay
    url: https://ellkay.com
    email: ''
  version: '6.6'
  x-logo:
    url: ./logo.png
    altText: Ellkay Logo
servers:
- url: https://services.lkcloud.com
  description: prod url
tags:
- name: LKPatientBalance
  description: Load patient's balances. Allows patients to apply payments.
paths:
  /LKPatientBalance/ApplyPayment:
    post:
      tags:
      - LKPatientBalance
      summary: ApplyPayment
      description: 'Record a payment that has been made for the given patient. Supports copay''s, specific encounter payments, and payments to the overall patient account.

        ## Payment Batches

        It''s recommended that you provide a batch name and date with each payment message, which tells our adapter which payment batch to attach the payment to.


        If no payment batch data is provided with the message, the adapter will attach the payment to today''s open batch. If more than one open batch is found, the payment will fail.


        The adapter automatically creates a new batch when zero batches exist, but it won''t create a new batch when there are 1 or more batches. More than one matching batch causes a failure.

        ## Post "Kind"

        Each payment message must include a "PostKind" enum. The options are Copay, Deposit, or Balance.

        ### Copay

        Copay payments required a visit ID be sent with the message, so we can record the copay for the correct visit.

        ### Deposit

        Deposit payments are simply recorded on the patient record. They are not posted to a particular visit or service.

        ### Balance

        Balance payments are recorded on the patient record, but also applied to services rendered for the patient. When a visit id is included with the message, the payment is only applied to a specific visit. If a visit id is not included with the message, the payment will be applied using the target systems first-in, first-out (FIFO) payment logic. Typically, this means the payment total amount is applied to the oldest visit with outstanding charges first, then to the second oldest visit, etc. Once the FIFO operation is completed, any remaining amount is deposited to the patient account.'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.PatientBalance.ApplyPaymentSwaggerRequest'
            example:
              request:
                patientId: '856492'
                paymentMethod:
                  method: CreditCard
                  creditCardKind: Visa
                  detail: Paid via online portal
                payment:
                  referenceId: '436723'
                  postKind: Balance
                  visitId: '349'
                  amount: 150
                  note: Copay for office visit
                  batch:
                    name: '2025'
                    date: '2023-08-01T00:00:00+00:00'
                  date: '2023-08-01T00:00:00+00:00'
                  facilityId: '001'
                  providerId: '103'
                custom:
                  sourceSystem: EHR-X
                  notes: Office Visit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PatientBalance.ApplyPaymentResult'
              example:
                referenceId: '436723'
                paymentId: '423975'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientBalanceApplyPayment
      x-operation-id-source: derived
  /LKPatientBalance/BeginSearchClaims:
    post:
      tags:
      - LKPatientBalance
      summary: BeginSearchClaims
      description: The BeginSearchClaims endpoint initiates the process to search for claims, providing a next token for pagination purposes.
      requestBody:
        description: Request message
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.PatientBalance.BeginSearchClaimsSwaggerRequest'
            example:
              request:
                patientId: PAT1001
                claimId: CLM202512345
                serviceDateRange:
                  start: '2025-01-01T00:00:00.112+00:00'
                  end: '2025-12-31T00:00:00.112+00:00'
                claimDateRange:
                  start: '2025-01-01T00:00:00.112+00:00'
                  end: '2025-12-31T00:00:00.112+00:00'
                custom:
                  batchNumber: BATCH-2025-045
                rawRequest: null
                limit: 500
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.PagedResult'
              example:
                nextToken: eyJSZXF1ZXN0SWQiOiJyV0lDdWp2d01CaEpvOXRaM2pON2U0QT09IiwiVG9rZW4iOiJwMHZwMEQ2OVZHRitEWHdvRExfSFUwTlE9PSJ9
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKPatientBalanceBeginSearchClaims
      x-operation-id-source: derived
  /LKPatientBalance/GetAccount:
