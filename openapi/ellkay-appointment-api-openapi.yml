        https://hl7.org/fhir/R4/http.html#search'
      operationId: Search.Appointment.Get
      parameters:
      - name: date
        in: query
        description: 'Appointment date/time.

          [date] http://hl7.org/fhir/SearchParameter/Appointment-date'
        schema:
          type: string
      - name: patient
        in: query
        description: 'One of the individuals of the appointment is this patient

          [reference] http://hl7.org/fhir/SearchParameter/Appointment-patient'
        schema:
          type: string
      - name: status
        in: query
        description: 'The overall status of the appointment

          [token] http://hl7.org/fhir/SearchParameter/Appointment-status'
        schema:
          type: string
