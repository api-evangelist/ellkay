            example:
              request:
                patientId: '789456'
                id: '20240115'
                code: DNR
                displayName: Do Not Resuscitate
                effectiveDate: '2024-01-15T00:00:00.112+00:00'
                expirationDate: '2030-01-15T00:00:00.112+00:00'
                custom:
                  createdBy: Nurse.Alex
                  reviewedBy: Dr.Smith
                rawRequest: null
