      properties:
        text:
          type: string
          description: Description of the diagnosis
        code:
          type: string
          description: Diagnosis code
        system:
          type: string
          description: Coding system for the diagnosis
        isPrimary:
          type: boolean
          description: Indicates if this is the primary diagnosis
      additionalProperties: false
    LKCloudConnect.Swagger.SwaggerRequests.UpdatePatient.UpdateReferralSwaggerRequest:
      type: object
      properties:
        request:
