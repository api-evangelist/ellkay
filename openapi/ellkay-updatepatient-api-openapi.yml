        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.UpdatePatient.UpdatePatientReportingDataSwaggerRequest'
            example:
              request:
                patientId: '12396245'
                dateRecorded: '2023-09-01T00:00:00+00:00'
                factors:
                - type: Homeless
                  sourceName: Street Outreach Program
                  value: 'Yes'
                  notes: Living in vehicle; not accessing shelter services
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
