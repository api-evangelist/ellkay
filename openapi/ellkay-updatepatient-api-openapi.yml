openapi: 3.2.0
info:
  title: LKCloud Update Patient API
  description: Ellkay Api documentation 6.6 Ellkay api
  contact:
    name: Ellkay
    url: https://ellkay.com
    email: ''
  version: '6.6'
  x-logo:
    url: ./logo.png
    altText: Ellkay Logo
servers:
- url: https://services.lkcloud.com
  description: prod url
tags:
- name: UpdatePatient
  description: UpdatePatient endpoint
paths:
  /UpdatePatient/UpdatePatientService.svc/CreatePatient:
    post:
      tags:
      - UpdatePatient
      summary: CreatePatient
      description: Create patient record in the target system
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.UpdatePatient.CreatePatientSwaggerRequest'
            example:
              request:
                createPatient:
                  createPatientDetails:
                    firstName: William
                    middleName: M
                    lastName: Brown
                    dateOfBirth: '1984-05-23T00:00:00'
                    sex: M
                    email: TestPatient@yahoo.com
                    mobilePhone: +1-985-237-3495
                    homePhone: +1-985-237-3495
                    address1: 7690 Monroe Blvd
                    address2: Suite 12
                    city: Atlantic City
                    state: NJ
                    zip: '00255'
                    socialSecurityNumber: null
                    ssnNotProvidedReason:
                      code: null
                      source: '14'
                      sourceText: SSN unknown
                    providerId: '7'
                    externalId: ''
                    releaseOfInformation: 'Yes'
                    rxHistoryConsent: 'Yes'
                    notes: Patient prefers morning appointments.
                    sexAtBirth: Male
                    pronouns: he/him
                    workPhone: +1-985-237-3495
                    workPhoneExt: '2546'
                    countryCode:
                      code: US
                      sourceText: UNITED STATES
                      source: US
                    identifiers:
                    - value: '6057'
                      type:
                        code: MedicalRecordNumber
                        source: MedicalRec#
                    - value: 00046057-008
                      type:
                        code: ChartNumber
                        source: Account No
                  primaryFacility:
                    id: '3'
                  custom:
                    renderingProviderName: Christensen, Tyler
                    renderingProviderId: '9141'
                    releaseOfInformation: Y
                    selfPay: 'False'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.CreatePatientResult'
              example:
                createdPatientId: '7887683'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postUpdatePatientUpdatePatientServiceSvcCreatePatient
      x-operation-id-source: derived
  /UpdatePatient/UpdatePatientService.svc/CreateReferral:
    post:
      tags:
      - UpdatePatient
      summary: CreateReferral
      description: CreateReferral endpoint for create referral record.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.UpdatePatient.CreateReferralSwaggerRequest'
            example:
              request:
                patientId: '123456'
                authorizationNumber: '987654'
                referralId: '001122'
                referralNumber: '20250201'
                status: Pending
                priority: routine
                referralType: Consultation
                reasons:
                - reason: Knee pain evaluation
                insCode: '4455'
                encounterId: '778899'
                fromFacilityId: '1001'
                fromPhysicianId: '2001'
                toFacilityId: '3001'
                toPhysicianId: '4001'
                specialty: Orthopedics
                appointmentDate: '2025-11-02T03:30:00.112+00:00'
                referralDate: '2025-09-12T10:00:00.112+00:00'
                effectiveDate: '2025-11-02T03:30:00.112+00:00'
                expirationDate: '2025-12-01T03:30:00.112+00:00'
                dateRecorded: '2025-11-02T03:30:00.112+00:00'
                diagnosis:
                - text: Right knee pain
                  code: M25.561
                  system: ICD-10
                  isPrimary: true
                - text: Difficulty walking
                  code: R26.2
                  system: ICD-10
                  isPrimary: false
                procedure:
                - text: Knee X-ray
                  code: '73560'
                  system: CPT
                - text: Office visit (new patient)
                  code: '99203'
                  system: CPT
                notes: Morning appointment preferred.
                custom:
                  caseManager: John Smith
                  flag: Expedite
                rawRequest: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.UpdatePatient.CreateReferralResponse'
              example:
                id: '7887683'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postUpdatePatientUpdatePatientServiceSvcCreateReferral
      x-operation-id-source: derived
