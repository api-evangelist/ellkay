components:
  schemas:
    LKCloudConnect.Contracts.Bridge.CreatePatient:
      type: object
      properties:
        createPatientDetails:
          allOf:
          - $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.CreatePatientDetail'
          description: Details and demographics of the patient to store
        primaryFacility:
          allOf:
          - $ref: '#/components/schemas/LKCloudConnect.Contracts.Bridge.PrimaryFacility'
          description: Facility the patient primarily visits
        custom:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
          description: System-specific data for special cases
      additionalProperties: false
    LKCloudConnect.Contracts.UpdatePatient.UpdateReferralResponse:
      type: object
      additionalProperties: false
    LKCloudConnect.Swagger.SwaggerRequests.UpdatePatient.UpdateAdvanceDirectiveSwaggerRequest:
      type: object
      properties:
        request:
          allOf:
          - $ref: '#/components/schemas/LKCloudConnect.Contracts.UpdatePatient.UpdateAdvanceDirectiveRequest'
      additionalProperties: false
    LKCloudConnect.Contracts.Bridge.ReferralsDiagnosis:
