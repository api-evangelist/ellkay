openapi: 3.2.0
info:
  title: LKCloud LK Master List API
  description: Ellkay Api documentation 6.6 Ellkay api
  contact:
    name: Ellkay
    url: https://ellkay.com
    email: ''
  version: '6.6'
  x-logo:
    url: ./logo.png
    altText: Ellkay Logo
servers:
- url: https://services.lkcloud.com
  description: prod url
tags:
- name: LKMasterList
  description: Master List.
paths:
  /LKMasterList/CreateEmployer:
    post:
      tags:
      - LKMasterList
      summary: CreateEmployer
      description: Create an employer and post it to the target system
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/LKCloudConnect.Swagger.SwaggerRequests.LKMasterList.CreateEmployerSwaggerRequest'
            example:
              request:
                company: Ogden City Corporation
                address1: '1525 E 6000 S # B'
                address2: ''
                city: South Ogden
                state: UT
                zip: '56456'
                phoneNumber: 801-111-5818
                custom:
                  producer: Nvestment
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.MasterLists.CreateEmployerResult'
              example:
                id: '1'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LKCloudConnect.Contracts.LKCloudConnectFault'
      operationId: postLKMasterListCreateEmployer
      x-operation-id-source: derived
